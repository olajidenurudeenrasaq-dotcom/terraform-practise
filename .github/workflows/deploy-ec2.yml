name: Deploy practice EC2

on:
  workflow_dispatch:

concurrency:
  group: terraform-practice-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for requesting the OIDC token
      contents: read # Required for checkout
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    defaults:
      run:
        shell: bash
        working-directory: Git practise/Github action
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required repository variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" || -z "$AWS_REGION" || -z "$TF_STATE_BUCKET" ]]; then
            echo "::error::Set AWS_ROLE_ARN, AWS_REGION, and TF_STATE_BUCKET in repository Actions variables."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Initialize Terraform
        run: >-
          terraform init -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=github-action-ec2/terraform.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Plan deployment
        run: terraform plan -input=false -out=tfplan

      - name: Apply deployment
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show website URL
        run: |
          echo "The web server may take a minute or two to finish starting."
          terraform output -raw website_url
